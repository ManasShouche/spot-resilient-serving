[project]
name = "kvevac"
version = "0.1.0"
description = "Deadline-bounded KV-cache evacuation for LLM serving on spot instances."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "jmespath>=1,<2", "scikit-learn>=1.5"]  # jmespath: jobs/aws/dry_run.sh

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kvevac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
