<text x="258.8" y="374" font-size="11" fill="#52514e" text-anchor="middle">200 MB/s</text>
<text x="383.2" y="374" font-size="11" fill="#52514e" text-anchor="middle">83 MB/s (shared store)</text>
<text x="507.8" y="374" font-size="11" fill="#52514e" text-anchor="middle">40 MB/s</text>
<text x="321.0" y="398" font-size="11.5" fill="#52514e" text-anchor="middle">Per-node write-through bandwidth budget (drop on backpressure); notice W = 120 s</text>
