<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Write-through degrades under a bandwidth budget; hybrid does not">
<rect width="720" height="420" fill="#fcfcfb"/>
